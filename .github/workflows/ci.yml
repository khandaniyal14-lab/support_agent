name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .


  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_support_agent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_support_agent
      CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_support_agent
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      MISTRAL_API_KEY: test-key
      MISTRAL_MODEL: mistral-small-latest
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Ingest knowledge base
        run: uv run python -m scripts.ingest_knowledge

      - name: Run tests
        run: uv run pytest -v

  evaluation:
    name: Evaluation Quality Gates
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
         --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"
         --health-interval=10s
         --health-timeout=5s
         --health-retries=5

    env:
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Ingest knowledge base
        run: uv run python -m scripts.ingest_knowledge

      - name: Run RAG evaluation
        run: uv run python -m scripts.evaluate_rag_quality

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
      - evaluation

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}